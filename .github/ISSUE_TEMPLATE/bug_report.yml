name: Bug report
description: Report a reproducible problem without sharing credentials or private prompts.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Never include API keys, access tokens, private prompts, or personal dictionaries.
  - type: input
    id: comfyui_version
    attributes:
      label: ComfyUI and frontend version
      placeholder: "ComfyUI ..., frontend ..."
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation type
      options:
        - ComfyUI Desktop
        - Windows Portable
        - Git/manual installation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a minimal sanitized prompt if prompt content is relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
